<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1604" role="img" aria-label="BPMN 2.0 · Event intake"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#53677b"/></marker></defs><style>text{font:15px Arial;fill:#17334d}.label{font-size:13px}</style><polyline points="450.0,69 450.0,110" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="482,142.0 700,142.0" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="label" x="598.0" y="135.0">yes</text><polyline points="835.0,180 835.0,225" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="450.0,174 450.0,250" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="label" x="457.0" y="205.0">no</text><polyline points="482,282.0 700,282.0" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="label" x="598.0" y="275.0">yes</text><polyline points="835.0,320 835.0,365" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="450.0,314 450.0,390" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="label" x="457.0" y="345.0">no</text><polyline points="450.0,466 450.0,530" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="482,562.0 700,562.0" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="label" x="598.0" y="555.0">yes</text><polyline points="835.0,600 835.0,640" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="450.0,594 450.0,660" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="label" x="457.0" y="620.0">no</text><polyline points="450.0,736 450.0,810" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="482,842.0 813,842.0" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="label" x="654.5" y="835.0">yes</text><polyline points="450.0,874 450.0,940" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="label" x="457.0" y="900.0">no</text><polyline points="450.0,1016 450.0,1080" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="482,1112.0 813,1112.0" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="label" x="654.5" y="1105.0">no</text><polyline points="450.0,1144 450.0,1210" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="label" x="457.0" y="1170.0">yes</text><polyline points="450.0,1286 450.0,1350" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="450.0,1426 450.0,1490" fill="none" stroke="#53677b" stroke-width="1.7" marker-end="url(#arrow)"/><circle cx="450.0" cy="47.0" r="21" fill="white" stroke="#207b85" stroke-width="2"/><text x="414" y="43" text-anchor="end">Event received</text><path d="M450,110 L482,142 L450,174 L418,142 Z" fill="#fff0d2" stroke="#ad6800" stroke-width="2"/><text x="450" y="148" text-anchor="middle">×</text><text x="404" y="128" text-anchor="end">Session event? goal /</text><text x="404" y="146" text-anchor="end">dismiss / request /</text><text x="404" y="164" text-anchor="end">lsp_result / session_end</text><rect x="700" y="104" width="270" height="76" rx="10" fill="#e2f2f2" stroke="#207b85" stroke-width="2"/><text x="835.0" y="129.0" text-anchor="middle">Record it; session_end drops</text><text x="835.0" y="147.0" text-anchor="middle">that editor&#x27;s overlays and</text><text x="835.0" y="165.0" text-anchor="middle">requeues those paths</text><circle cx="835.0" cy="247.0" r="21" fill="white" stroke="#207b85" stroke-width="4"/><text x="799" y="243" text-anchor="end">Published; no file analysis</text><path d="M450,250 L482,282 L450,314 L418,282 Z" fill="#fff0d2" stroke="#ad6800" stroke-width="2"/><text x="450" y="288" text-anchor="middle">×</text><text x="404" y="268" text-anchor="end">Cursor or diagnostics?</text><rect x="700" y="244" width="270" height="76" rx="10" fill="#e2f2f2" stroke="#207b85" stroke-width="2"/><text x="835.0" y="278.0" text-anchor="middle">Append event; store diagnostics</text><text x="835.0" y="296.0" text-anchor="middle">for republication</text><circle cx="835.0" cy="387.0" r="21" fill="white" stroke="#207b85" stroke-width="4"/><text x="799" y="383" text-anchor="end">No investigation</text><rect x="315" y="390" width="270" height="76" rx="10" fill="#e2f2f2" stroke="#207b85" stroke-width="2"/><text x="450.0" y="406.0" text-anchor="middle">Resolve content: editor text</text><text x="450.0" y="424.0" text-anchor="middle">(hash verified) → recorded SHA →</text><text x="450.0" y="442.0" text-anchor="middle">disk. Origin is editor when the</text><text x="450.0" y="460.0" text-anchor="middle">buffer is dirty</text><path d="M450,530 L482,562 L450,594 L418,562 Z" fill="#fff0d2" stroke="#ad6800" stroke-width="2"/><text x="450" y="568" text-anchor="middle">×</text><text x="404" y="548" text-anchor="end">Content missing?</text><rect x="700" y="524" width="270" height="76" rx="10" fill="#e2f2f2" stroke="#207b85" stroke-width="2"/><text x="835.0" y="558.0" text-anchor="middle">Log file_deleted; forget any</text><text x="835.0" y="576.0" text-anchor="middle">overlay</text><circle cx="835.0" cy="662.0" r="21" fill="white" stroke="#207b85" stroke-width="4"/><text x="799" y="658" text-anchor="end">Deletion handling stops</text><rect x="315" y="660" width="270" height="76" rx="10" fill="#e2f2f2" stroke="#207b85" stroke-width="2"/><text x="450.0" y="676.0" text-anchor="middle">Seed Git HEAD baseline on first</text><text x="450.0" y="694.0" text-anchor="middle">live sight; snapshot with</text><text x="450.0" y="712.0" text-anchor="middle">origin; record overlay or disk</text><text x="450.0" y="730.0" text-anchor="middle">revision; log without text</text><path d="M450,810 L482,842 L450,874 L418,842 Z" fill="#fff0d2" stroke="#ad6800" stroke-width="2"/><text x="450" y="848" text-anchor="middle">×</text><text x="404" y="828" text-anchor="end">Same bytes AND same origin?</text><circle cx="835.0" cy="842.0" r="21" fill="white" stroke="#207b85" stroke-width="4"/><text x="799" y="838" text-anchor="end">No work</text><rect x="315" y="940" width="270" height="76" rx="10" fill="#e2f2f2" stroke="#207b85" stroke-width="2"/><text x="450.0" y="974.0" text-anchor="middle">Submit path, SHA and origin to</text><text x="450.0" y="992.0" text-anchor="middle">scheduler</text><path d="M450,1080 L482,1112 L450,1144 L418,1112 Z" fill="#fff0d2" stroke="#ad6800" stroke-width="2"/><text x="450" y="1118" text-anchor="middle">×</text><text x="404" y="1098" text-anchor="end">Bytes actually changed?</text><circle cx="835.0" cy="1112.0" r="21" fill="white" stroke="#207b85" stroke-width="4"/><text x="799" y="1108" text-anchor="end">Save of already-analysed</text><text x="799" y="1126" text-anchor="end">bytes; tools rerun, nothing</text><text x="799" y="1144" text-anchor="end">invalidated</text><rect x="315" y="1210" width="270" height="76" rx="10" fill="#e2f2f2" stroke="#207b85" stroke-width="2"/><text x="450.0" y="1244.0" text-anchor="middle">Mark dependent claims stale and</text><text x="450.0" y="1262.0" text-anchor="middle">requeue their defining files</text><rect x="315" y="1350" width="270" height="76" rx="10" fill="#e2f2f2" stroke="#207b85" stroke-width="2"/><text x="450.0" y="1375.0" text-anchor="middle">Requeue any claim whose callee</text><text x="450.0" y="1393.0" text-anchor="middle">this file now names but never</text><text x="450.0" y="1411.0" text-anchor="middle">depended on</text><circle cx="450.0" cy="1512.0" r="21" fill="white" stroke="#207b85" stroke-width="4"/><text x="414" y="1508" text-anchor="end">Event handled; worker runs</text><text x="414" y="1526" text-anchor="end">separately</text></svg>